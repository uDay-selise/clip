<style>
    .ed-top { display: flex; align-items: center; gap: calc(16px * var(--space-scale, 1)); padding: calc(12px * var(--space-scale, 1)) 0; flex-wrap: nowrap; }
    .ed-brand { display: inline-flex; align-items: center; gap: calc(10px * var(--space-scale, 1)); text-decoration: none; flex-shrink: 0; }
    .ed-mark { width: 28px; height: 28px; border-radius: 8px; background: hsl(var(--brand)); display: inline-flex; align-items: center; justify-content: center; color: hsl(var(--brand-foreground)); font-family: var(--font-heading); font-weight: 700; font-size: 13px; }
    .ed-brand .ds-brand-text { font-family: var(--font-heading); font-weight: 700; font-size: 18px; letter-spacing: -0.02em; color: hsl(var(--foreground)); }
    .ed-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: hsl(var(--primary-text)); background: hsl(var(--primary) / 0.14); border-radius: 999px; padding: 4px 10px; }
    .ed-tabs { display: flex; gap: calc(4px * var(--space-scale, 1)); margin-left: calc(12px * var(--space-scale, 1)); }
    .ed-tab { font-size: 14px; font-weight: 500; color: hsl(var(--muted-foreground)); text-decoration: none; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
    .ed-tab.ds-active { background: hsl(var(--primary) / 0.12); color: hsl(var(--primary-text)); font-weight: 600; }
    .ed-end { display: flex; align-items: center; gap: calc(12px * var(--space-scale, 1)); flex-shrink: 0; }
    .ed-user .ds-user-name { font-size: 14px; font-weight: 600; }
    .ed-user .ds-user-role { font-size: 12px; }
  </style>
  <header style="background: hsl(var(--card)); border-bottom: 1px solid hsl(var(--border));" data-eid="e1">
    <div class="ds-bar ed-top" data-eid="e2">
      <a class="ed-brand" data-goto="editor" data-eid="e3">
        <span class="ed-mark" aria-hidden="true" data-eid="e4">D</span>
        <span class="ds-brand-text" data-eid="e5">Donkey website</span>
        <span class="ed-tag" data-eid="e6">Editors</span>
      </a>
      <nav class="ed-tabs ds-only-wide" aria-label="Editors' area" data-eid="e7">
        <a class="ed-tab ds-active" data-goto="editor" data-eid="e8">Products</a>
        <a class="ed-tab" data-goto="editor" data-eid="e9">Page wording</a>
        <a class="ed-tab" data-goto="editor" data-eid="e10">Form entries</a>
      </nav>
      <span class="ds-spacer" data-eid="e11"></span>
      <div class="ed-end" data-eid="e12">

          <button class="ds-active" aria-label="Light" data-eid="e14"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button aria-label="Dark" data-eid="e15"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
          <button aria-label="Auto" data-eid="e16"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
        </div>
        <div class="ds-user ds-only-wide" data-sample data-eid="e17">
          <span class="ds-avatar" data-eid="e18">RM</span>
          <span class="ds-user-text" data-eid="e19"><b class="ds-user-name" data-sample="me.name">Rosa Mbeki</b><span class="ds-user-role" data-sample="me.role" data-eid="e20">Editor</span></span>
        </div>
        <details class="ds-menu">
          <summary class="ds-btn ds-btn-ghost ds-btn-icon" aria-label="More actions for the editors' area"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></summary>
          <div class="ds-menu-list" data-eid="e21">
            <a data-goto="editor" data-eid="e22">Products</a>
            <a data-goto="editor" data-eid="e23">Page wording</a>
            <a data-goto="editor" data-eid="e24">Form entries</a>

              <button class="ds-active" aria-label="Light" data-eid="e26"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
              <button aria-label="Dark" data-eid="e27"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
              <button aria-label="Auto" data-eid="e28"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
            </div>

      </div>
    </div>
  </header>
